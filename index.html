<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24절기 퍼즐</title>
<style>
:root{--bg:#faf6ee;--fg:#2b2a27;--mut:#7a746a;--card:#fff;--line:#e4dccb;--acc:#c2552d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c19;--fg:#f1ece1;--mut:#a39c8e;--card:#2a2824;--line:#3d3a33;--acc:#e8825a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1c19;--fg:#f1ece1;--mut:#a39c8e;--card:#2a2824;--line:#3d3a33;--acc:#e8825a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:22px;margin:0 0 4px;text-align:center}
p.sub{margin:0 0 16px;text-align:center;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 5px 6px;cursor:pointer;text-align:center;color:var(--fg);font:inherit;position:relative}
.cell svg{display:block;width:100%;height:auto;border-radius:8px}
.cell .n{font-size:12px;display:block;margin-top:4px}
.cell.done::after{content:"✓";position:absolute;top:8px;right:9px;color:#fff;background:var(--acc);width:16px;height:16px;border-radius:50%;font-size:11px;line-height:16px;font-weight:700}
.seg{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:8px 18px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#play{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px}
button.t{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.title{text-align:center;margin-bottom:12px}
.title b{font-size:20px}.title span{display:block;color:var(--mut);font-size:13px}
#board{--b:min(88vw,360px);position:relative;width:var(--b);height:var(--b);margin:0 auto;border-radius:14px;overflow:hidden;background:var(--line)}
.tile{position:absolute;width:calc(var(--b)/var(--n,2));height:calc(var(--b)/var(--n,2));overflow:hidden;transition:transform .16s ease;cursor:pointer;border:1px solid rgba(255,255,255,.55)}
.tile svg{position:absolute;width:var(--b);height:var(--b)}
.tile.blank{visibility:hidden}
#board.won .tile{border-color:transparent;cursor:default}
#prev{position:absolute;inset:0;display:none;z-index:3}
#prev svg{width:100%;height:100%;display:block}
#info{margin:16px auto 0;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
#info b{color:var(--acc)}
#msg{text-align:center;margin:14px 0 0;min-height:20px}
#msg b{color:var(--acc);font-size:18px}
</style>
</head>
<body>
<main>
<section id="home">
<h1>24절기 퍼즐</h1>
<p class="sub">난이도를 고르고, 절기를 눌러 그림을 맞춰 보세요</p>
<div class="seg" id="seg"><button data-n="2">2×2 쉬움</button><button data-n="3">3×3 보통</button></div>
<div class="grid" id="grid"></div>
</section>
<section id="play">
<div class="bar">
<button class="t" id="back">← 목록</button>
<span>이동 <b id="mv">0</b>회</span>
<button class="t" id="hint">힌트(누르기)</button>
</div>
<div class="title"><b id="tt"></b><span id="td"></span></div>
<div id="board"></div>
<div id="msg"></div>
<div id="info"></div>
</section>
</main>
<script>
/* ---------- 절기 데이터: [이름, 한자, 양력, 설명] ---------- */
var T=[
["입춘","立春","2월 4일","봄의 시작입니다. 겨울 끝자락에 입춘대길을 써 붙이며 한 해의 복을 빌었습니다."],
["우수","雨水","2월 19일","눈이 녹아 비가 되는 때입니다. 강물이 풀리고 새싹이 움트기 시작합니다."],
["경칩","驚蟄","3월 6일","겨울잠을 자던 개구리가 천둥소리에 놀라 깨어나는 때입니다."],
["춘분","春分","3월 21일","낮과 밤의 길이가 같아지는 날입니다. 본격적인 봄 농사가 시작됩니다."],
["청명","淸明","4월 5일","하늘이 맑고 깨끗한 때입니다. 나무를 심고 봄 농사를 준비합니다."],
["곡우","穀雨","4월 20일","봄비가 곡식을 키우는 때입니다. 못자리를 만들고 볍씨를 뿌립니다."],
["입하","立夏","5월 6일","여름의 시작입니다. 푸른 잎이 우거지고 모내기 준비가 한창입니다."],
["소만","小滿","5월 21일","만물이 점점 차오르는 때입니다. 보리가 익어 가고 모내기가 시작됩니다."],
["망종","芒種","6월 6일","까끄라기가 있는 곡식의 씨를 뿌리고 보리를 베는, 1년 중 가장 바쁜 때입니다."],
["하지","夏至","6월 21일","1년 중 낮이 가장 긴 날입니다. 감자를 캐고 장마를 앞두고 일손이 바쁩니다."],
["소서","小暑","7월 7일","작은 더위가 시작되고 장마철에 접어듭니다. 연꽃이 피어나는 때입니다."],
["대서","大暑","7월 23일","1년 중 가장 무더운 때입니다. 수박과 참외가 맛있게 익는 철입니다."],
["입추","立秋","8월 7일","가을의 시작입니다. 아침저녁으로 서늘한 바람이 불기 시작합니다."],
["처서","處暑","8월 23일","더위가 물러가는 때입니다. 모기 입이 비뚤어진다는 말이 전해 옵니다."],
["백로","白露","9월 8일","풀잎에 하얀 이슬이 맺히는 때입니다. 가을 기운이 완연해집니다."],
["추분","秋分","9월 23일","낮과 밤의 길이가 다시 같아지는 날입니다. 곡식이 익고 단풍이 듭니다."],
["한로","寒露","10월 8일","찬 이슬이 맺히는 때입니다. 국화가 피고 단풍이 절정에 이릅니다."],
["상강","霜降","10월 23일","서리가 내리는 때입니다. 감을 따고 가을걷이를 마무리합니다."],
["입동","立冬","11월 7일","겨울의 시작입니다. 김장을 담그며 겨울날 채비를 합니다."],
["소설","小雪","11월 22일","첫눈이 내리는 때입니다. 얇은 얼음이 얼고 겨울 준비를 서두릅니다."],
["대설","大雪","12월 7일","눈이 많이 내리는 때입니다. 포근하게 눈 덮인 겨울 풍경이 펼쳐집니다."],
["동지","冬至","12월 22일","1년 중 밤이 가장 긴 날입니다. 팥죽을 먹으며 나쁜 기운을 쫓았습니다."],
["소한","小寒","1월 5일","작은 추위입니다. 대한보다 더 춥다는 말이 있을 만큼 매서운 때입니다."],
["대한","大寒","1월 20일","1년 중 가장 추운 때입니다. 이 고비를 넘기면 다시 입춘이 찾아옵니다."]];

/* ---------- SVG 그림 도구 (직접 그린 도형 조합) ---------- */
var G="g";
var R=function(n,x,dx,y,f){var s="";for(var i=0;i<n;i++)s+=f(x+i*dx,y,i);return s};
var S=function(a,b){return '<defs><linearGradient id="'+G+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="300" height="300" fill="url(#'+G+')"/>'};
var tg=function(x,y,s,i){return '<g transform="translate('+x+' '+y+') scale('+s+')">'+i+'</g>'};
var sun=function(x,y,r,c,ray){c=c||"#ffd23f";return (ray?R(12,0,1,0,function(a,b,i){return '<path d="M'+x+' '+(y-r-6)+'v-14" stroke="'+c+'" stroke-width="5" stroke-linecap="round" transform="rotate('+i*30+' '+x+' '+y+')"/>'}):"")+'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"/>'};
var moon=function(x,y,r,bg){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#fff6c9"/><circle cx="'+(x+r*.45)+'" cy="'+(y-r*.2)+'" r="'+r*.85+'" fill="'+bg+'"/>'};
var cloud=function(x,y,s,c){return tg(x,y,s,'<g fill="'+(c||"#fff")+'"><ellipse rx="30" ry="14"/><circle cx="-12" cy="-10" r="14"/><circle cx="10" cy="-14" r="17"/></g>')};
var hill=function(y,c,a){a=a||20;return '<path d="M0 '+y+'Q75 '+(y-a)+' 150 '+y+'T300 '+y+'V300H0Z" fill="'+c+'"/>'};
var tree=function(x,y,s,c){return tg(x,y,s,'<rect x="-4" y="-30" width="8" height="30" fill="#7a4e2d"/><g fill="'+c+'"><circle cy="-45" r="26"/><circle cx="-16" cy="-32" r="16"/><circle cx="16" cy="-32" r="16"/></g>')};
var pine=function(x,y,s,sn){return tg(x,y,s,'<rect x="-4" y="-22" width="8" height="22" fill="#6b4a2d"/><path d="M-32 -18L0 -62L32 -18Z" fill="#2f7a4a"/><path d="M-26 -44L0 -84L26 -44Z" fill="#37895a"/><path d="M-18 -70L0 -104L18 -70Z" fill="#2f7a4a"/>'+(sn?'<path d="M-9 -90L0 -104L9 -90Z" fill="#fff"/><path d="M-14 -58L0 -84L14 -58Z" fill="#fff" opacity=".85"/>':""))};
var bare=function(x,y,s,t,r){r=r||3.5;var p=[[-18,-50],[16,-58],[-8,-68],[0,-50]];return tg(x,y,s,'<path d="M0 0V-50M0 -30L-18 -50M0 -38L16 -58M0 -50L-8 -68" stroke="#5b4030" stroke-width="4" stroke-linecap="round" fill="none"/>'+(t?p.map(function(q){return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+r+'" fill="'+t+'"/>'}).join(""):""))};
var flower=function(x,y,c,s){return tg(x,y,s||1,'<path d="M0 0V-20" stroke="#3a8a3a" stroke-width="3"/><g fill="'+c+'"><circle cx="-7" cy="-24" r="6"/><circle cx="7" cy="-24" r="6"/><circle cy="-31" r="6"/><circle cy="-18" r="6"/></g><circle cy="-24" r="4" fill="#ffb020"/>')};
var mum=function(x,y,c,s){return tg(x,y,s||1,'<path d="M0 0V-25" stroke="#3a8a3a" stroke-width="3"/><g transform="translate(0 -32)">'+R(8,0,1,0,function(a,b,i){return '<ellipse cy="-9" rx="4" ry="10" fill="'+c+'" transform="rotate('+i*45+')"/>'})+'<circle r="5" fill="#e08a1a"/></g>')};
var stalk=function(x,y,c,s){return tg(x,y,s||1,'<path d="M0 0Q-3 -30 2 -62" stroke="'+c+'" stroke-width="3" fill="none"/><g fill="'+c+'"><ellipse cx="-4" cy="-52" rx="3" ry="6"/><ellipse cx="6" cy="-58" rx="3" ry="6"/><ellipse cx="-3" cy="-62" rx="3" ry="6"/><ellipse cx="3" cy="-70" rx="3" ry="6"/></g>')};
var leaf=function(x,y,c,r){return '<ellipse cx="'+x+'" cy="'+y+'" rx="9" ry="5" fill="'+c+'" transform="rotate('+r+' '+x+' '+y+')"/>'};
var rain=function(n,c){return R(n,0,1,0,function(a,b,i){var x=(i*37+10)%300,y=(i*53+30)%230;return '<path d="M'+x+' '+y+'l-5 14" stroke="'+c+'" stroke-width="2.5" stroke-linecap="round"/>'})};
var snow=function(n){return R(n,0,1,0,function(a,b,i){return '<circle cx="'+((i*47+13)%300)+'" cy="'+((i*89+20)%280)+'" r="2.8" fill="#fff"/>'})};
var stars=function(n){return R(n,0,1,0,function(a,b,i){return '<circle cx="'+((i*71+20)%300)+'" cy="'+((i*43)%150+12)+'" r="1.8" fill="#fff7c9"/>'})};
var frog=function(x,y){return tg(x,y,1,'<ellipse rx="32" ry="22" fill="#4fae4f"/><circle cx="-17" cy="-18" r="10" fill="#fff"/><circle cx="17" cy="-18" r="10" fill="#fff"/><circle cx="-17" cy="-18" r="4.5" fill="#222"/><circle cx="17" cy="-18" r="4.5" fill="#222"/><path d="M-14 6Q0 16 14 6" stroke="#2f7a2f" stroke-width="3" fill="none" stroke-linecap="round"/>')};
var lotus=function(x,y){return tg(x,y,1,R(5,-50,25,0,function(a){return '<ellipse cy="-18" rx="9" ry="21" fill="#ff8fb8" transform="rotate('+a+')"/>'})+'<circle cy="-8" r="6" fill="#ffd23f"/>')};
var melon=function(){return '<path d="M50 140A100 100 0 0 0 250 140Z" fill="#2e8b3a"/><path d="M58 140A92 92 0 0 0 242 140Z" fill="#e9f5d0"/><path d="M66 140A84 84 0 0 0 234 140Z" fill="#ff4f5e"/>'+[[100,170],[140,190],[180,170],[215,150],[150,155],[120,148]].map(function(q){return '<ellipse cx="'+q[0]+'" cy="'+q[1]+'" rx="3.5" ry="6" fill="#2b1a1a" transform="rotate(25 '+q[0]+' '+q[1]+')"/>'}).join("")};
var bowl=function(){return '<path d="M70 150H230Q226 235 150 242Q74 235 70 150Z" fill="#8b3a2b"/><ellipse cx="150" cy="150" rx="80" ry="17" fill="#b3242a"/>'+[[110,148],[150,156],[190,148],[130,142],[172,141]].map(function(q){return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="8" fill="#fff"/>'}).join("")+'<path d="M120 120Q110 100 122 85M150 115Q140 92 152 75M180 120Q170 100 182 85" stroke="#fff" stroke-opacity=".6" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="120" y="242" width="60" height="10" rx="4" fill="#6b2a20"/>'};
var snowman=function(x,y){return tg(x,y,1,'<g fill="#fff" stroke="#b7c6dc" stroke-width="2"><circle cy="-32" r="32"/><circle cy="-76" r="23"/><circle cy="-108" r="16"/></g><circle cx="-5" cy="-111" r="2" fill="#222"/><circle cx="5" cy="-111" r="2" fill="#222"/><path d="M0 -106l14 3l-14 3Z" fill="#ff8a1a"/><circle cy="-80" r="2.5" fill="#222"/><circle cy="-70" r="2.5" fill="#222"/><rect x="-12" y="-130" width="24" height="9" fill="#3a3a4a"/>')};
var dragon=function(x,y){return tg(x,y,1,'<path d="M-14 0H16" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><circle cx="-16" cy="0" r="4" fill="#c0392b"/><g fill="#fff" opacity=".8"><ellipse cx="0" cy="-8" rx="12" ry="4"/><ellipse cx="6" cy="8" rx="12" ry="4"/></g>')};
var grass=function(){return R(10,20,29,280,function(x,y,i){var d=i%2?10:-10;return '<path d="M'+x+' '+y+'Q'+(x+d)+' '+(y-50)+' '+(x+2*d)+' '+(y-85)+'" stroke="#4f9a5a" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="'+(x+2*d)+'" cy="'+(y-85)+'" r="5" fill="#e8f6ff"/>'})};

/* ---------- 24개 장면 ---------- */
var SC=[
function(){return S("#bfe6ff","#fff4c2")+sun(235,65,26)+hill(215,"#9ad47a")+bare(110,228,1.8,"#ff9fc0")+R(3,190,35,245,function(x,y){return flower(x,y,"#fff",.7)})},

function(){return S("#a8dcff","#fff1d0")+sun(60,60,30)+cloud(225,70,1.2)+hill(200,"#86cf6a")+R(5,40,55,262,function(x,y,i){return flower(x,y,["#ff8fb1","#ffd23f","#fff","#c58cff","#ff8fb1"][i],1.2)})},
function(){return S("#5fb0e8","#d4efff")+sun(245,55,24)+cloud(80,60,1.8)+hill(220,"#8ccf6d")+tree(150,245,2,"#ffb7c9")},
function(){return S("#9fc2d4","#d6e8cf")+cloud(100,60,2,"#bcc9d1")+cloud(220,80,1.5,"#cdd8de")+rain(14,"#5b8db0")+'<rect y="190" width="300" height="110" fill="#8fc0d8"/>'+R(6,30,48,245,function(x,y){return stalk(x,y,"#3fae4a",.9)})+R(6,54,48,290,function(x,y){return stalk(x,y,"#4fbe5a",1)})},
function(){return S("#8fd3ff","#e8ffd0")+sun(240,55,28)+hill(190,"#6fc46a",25)+tree(90,255,1.7,"#2f9e4f")+tree(210,260,1.4,"#45b35e")},
function(){return S("#a4e0ff","#f3ffd0")+sun(60,55,24)+hill(190,"#c8d86a")+R(7,25,42,255,function(x,y){return stalk(x,y,"#9bbf3a",1.1)})+R(6,46,42,295,function(x,y){return stalk(x,y,"#b5cf48",1.2)})},
function(){return S("#ffe29a","#fff3cf")+sun(235,60,30,"#ff9a3c")+hill(190,"#e9c765")+R(7,25,42,255,function(x,y){return stalk(x,y,"#d8a520",1.1)})+R(6,46,42,295,function(x,y){return stalk(x,y,"#e6b830",1.2)})},
function(){return S("#7fd0ff","#fff2b0")+sun(150,95,48,"#ffb81f",1)+hill(215,"#5fbf5a",26)+tree(60,262,1.5,"#2f9e4f")+tree(240,262,1.5,"#2f9e4f")},
function(){return S("#ffb36b","#ffe7a8")+sun(235,55,28,"#ff7a1a")+'<rect y="165" width="300" height="135" fill="#5fb7c9"/><ellipse cx="80" cy="235" rx="48" ry="12" fill="#3f9a5a"/><ellipse cx="220" cy="255" rx="55" ry="13" fill="#3f9a5a"/>'+lotus(150,225)},
function(){return S("#ff8a4d","#ffd36b")+sun(235,60,42,"#ff3b2f")+'<path d="M20 70q15 -15 0 -30t0 -30M60 90q15 -15 0 -30" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none"/>'+melon()},
function(){return S("#bfe3f5","#fff0cf")+cloud(80,60,1.6)+hill(200,"#a8cf6a")+tree(150,255,2,"#7fae3f")+leaf(60,150,"#e8a23a",30)+leaf(240,130,"#d9622b",-20)+leaf(210,200,"#e8a23a",50)+'<path d="M20 110q30 -10 60 0M230 90q25 -10 50 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>'},
function(){return S("#7f9bc4","#f2c9a0")+moon(70,60,22,"#8ba3c8")+hill(200,"#c9c36a")+R(7,25,42,255,function(x,y){return stalk(x,y,"#c8a830",1.1)})+R(6,46,42,295,function(x,y){return stalk(x,y,"#d6b63c",1.2)})+dragon(215,110)},

function art(i,pre){G=pre+i;return '<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">'+SC[i]()+'</svg>'}

/* ---------- 게임 로직 (3×3 슬라이딩) ---------- */
var N=2,B=3,done={},cur=0,pos=[],moves=0,won=false;
var $=function(i){return document.getElementById(i)};
try{done=JSON.parse(localStorage.getItem("st24")||"{}")}catch(e){done={}}
function save(){try{localStorage.setItem("st24",JSON.stringify(done))}catch(e){}}
function setN(n){N=n;B=n*n-1;document.querySelectorAll('#seg button').forEach(function(b){b.className=+b.dataset.n==n?'on':''})}
$("seg").onclick=function(e){var b=e.target.closest('button');if(b){setN(+b.dataset.n);home()}};
function nb(i){var r=(i/N)|0,c=i%N,a=[];if(r>0)a.push(i-N);if(r<N-1)a.push(i+N);if(c>0)a.push(i-1);if(c<N-1)a.push(i+1);return a}
function solved(){return pos.every(function(v,i){return v==i})}
function home(){var h="";T.forEach(function(t,i){h+='<button class="cell'+(done[N+"_"+i]?" done":"")+'" data-i="'+i+'">'+art(i,"h")+'<span class="n">'+t[0]+'</span></button>'});$("grid").innerHTML=h;$("play").style.display="none";$("home").style.display="block"}
$("grid").onclick=function(e){var c=e.target.closest(".cell");if(c)start(+c.dataset.i)};
function start(i){
cur=i;var t=T[i];$("home").style.display="none";$("play").style.display="block";
$("tt").textContent=t[0]+" "+t[1];$("td").textContent="양력 "+t[2]+" 무렵";
$("info").innerHTML="<b>"+t[0]+"</b> · "+t[3];
var b=$("board");b.className="";b.style.setProperty("--n",N);var h="",svg=art(i,"p");
for(var k=0;k<N*N;k++){var c=k%N,r=(k/N)|0;
h+='<div class="tile'+(k==B?" blank":"")+'" data-k="'+k+'">'+svg.replace("<svg ",'<svg style="left:calc(var(--b)/-'+N+'*'+c+');top:calc(var(--b)/-'+N+'*'+r+')" ')+"</div>"}
h+='<div id="prev">'+svg+"</div>";b.innerHTML=h;
moves=0;won=false;$("mv").textContent=0;$("msg").innerHTML="";
do{pos=[];for(var k=0;k<N*N;k++)pos.push(k);var last=-1;
for(var s=0;s<150;s++){var bl=pos.indexOf(B),o=nb(bl).filter(function(p){return p!==last}),p=o[(Math.random()*o.length)|0];pos[bl]=pos[p];pos[p]=B;last=bl}}while(solved());
layout()}
function layout(){document.querySelectorAll(".tile").forEach(function(el){var p=pos.indexOf(+el.dataset.k);el.style.transform="translate("+(p%N*100)+"%,"+(((p/N)|0)*100)+"%)"})}
$("board").onclick=function(e){
if(won)return;var el=e.target.closest(".tile");if(!el)return;
var p=pos.indexOf(+el.dataset.k),bl=pos.indexOf(B);
if(nb(bl).indexOf(p)<0)return;
pos[bl]=pos[p];pos[p]=B;moves++;$("mv").textContent=moves;layout();
if(solved()){won=true;done[N+"_"+cur]=1;save();$("board").className="won";
document.querySelector(".tile.blank").style.visibility="visible";
$("msg").innerHTML="<b>🎉 완성! "+moves+"번 만에 맞췄어요</b><br><button class=\"t p\" id=\"nx\" style=\"margin-top:8px\">다음 절기 →</button>"}};
document.addEventListener("click",function(e){if(e.target.id=="nx")start((cur+1)%24)});
$("back").onclick=home;
function hint(on){var p=$("prev");if(p)p.style.display=on?"block":"none"}
var hb=$("hint");
["mousedown","touchstart"].forEach(function(n){hb.addEventListener(n,function(e){e.preventDefault();hint(true)})});
["mouseup","mouseleave","touchend","touchcancel"].forEach(function(n){hb.addEventListener(n,function(){hint(false)})});
setN(2);home();
</script>
